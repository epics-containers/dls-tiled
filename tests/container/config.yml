# Smoke-test config for the runtime image: an empty catalog with the plugins loaded
authentication:
  allow_anonymous_access: true
  single_user_api_key: smoketest
trees:
  - path: /
    tree: catalog
    args:
      uri: "sqlite:////tmp/catalog.db"
      writable_storage: "/tmp/data"
      init_if_not_exists: true
routers:
  - dls_tiled.visr:visr_router
